name: Build gpkg

on:
  push:
    branches:
    - main
    paths:
    - 'gpkg/**'
  pull_request:
    paths:
    - 'gpkg/**'
  workflow_dispatch:
    inputs:
      packages:
        description: "A space-separated names of packages selected for rebuilding"
        required: true
        
permissions: {} # none

jobs:
  build:
    permissions:
      contents: read # actions/upload-artifact doesn't need contents: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target_arch: [aarch64, x86_64]
      fail-fast: false
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1000

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Get files from termux-packages repository
        run: ./get-build-package.sh

      - name: Gather build summary
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            BASE_COMMIT=$(jq --raw-output .pull_request.base.sha "$GITHUB_EVENT_PATH")
            OLD_COMMIT=$(jq --raw-output .commits[0].id "$GITHUB_EVENT_PATH")
            HEAD_COMMIT=$(jq --raw-output .commits[-1].id "$GITHUB_EVENT_PATH")
            if [ "$BASE_COMMIT" = "null" ]; then
              if [ "$OLD_COMMIT" = "$HEAD_COMMIT" ]; then
                CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${HEAD_COMMIT}")
              else
                OLD_COMMIT="${OLD_COMMIT}~1"
                CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${OLD_COMMIT}" "${HEAD_COMMIT}")
              fi
            else
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${BASE_COMMIT}" "HEAD")
            fi
          fi

          mkdir -p ./pkgs
          touch ./pkgs/.placeholder

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if grep -qiP '^\s*%ci:no-build\s*$' <(git log --format="%B" -n 1 "HEAD"); then
              echo "[!] Force exiting as tag '%ci:no-build' was applied to HEAD commit message."
              exit 0
            fi

            if grep -qP '^scripts/(Dockerfile|properties\.sh|setup-android-sdk\.sh|setup-cgct\.sh|setup-ubuntu\.sh)$' <<< "$CHANGED_FILES"; then
              docker build -t ghcr.io/termux/package-builder-cgct:latest .
            fi

            for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              while read -r file; do
                if ! [[ $file == ${repo_path}/* ]]; then continue; fi
                if [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/([.a-z0-9+-]*).subpackage.sh$ ]]; then
                  pkg=${BASH_REMATCH[1]}
                  subpkg=${BASH_REMATCH[2]}
                  if [ ! -f "${repo_path}/${pkg}/${subpkg}.subpackage.sh" ]; then
                    echo "$subpkg" >> ./deleted_${repo}_packages.txt
                  fi
                elif [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/.*$ ]]; then
                  pkg=${BASH_REMATCH[1]}
                  if [ -d "${repo_path}/${pkg}" ]; then
                    echo "$pkg" >> ./built_${repo}_packages.txt
                    for subfile in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                      echo "$(basename "${subfile%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                    done
                  else
                    echo "$pkg" >> ./deleted_${repo}_packages.txt
                  fi
                fi
              done <<< "${CHANGED_FILES}"
            done
          else
            for pkg in ${{ github.event.inputs.packages }}; do
              repo_paths=$(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json)
              found=false
              for repo_path in $repo_paths; do
                repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
                if [ -d "${repo_path}/${pkg}" ]; then
                  found=true
                  echo "$pkg" >> ./built_${repo}_packages.txt
                fi
              done
              if [ "$found" != true ]; then
                echo "Package '${pkg}' not found in any repo"
                exit 1
              fi
            done
          fi

          for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
            for list in packages subpackages; do
              if [ -f ./built_${repo}_${list}.txt ]; then
                sort ./built_${repo}_${list}.txt | uniq > tmp.txt && mv tmp.txt ./built_${repo}_${list}.txt
              fi
            done
          done

      - name: Build packages
        run: |
          declare -a packages
          for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
            repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
            if [ -f ./built_${repo}_packages.txt ]; then
              for pkg in $(cat ./built_${repo}_packages.txt); do
                packages="$packages ${repo_path}/${pkg}"
              done
            fi
          done

          if [ ! -z "$packages" ]; then
            pkg_names=$(for p in $packages; do basename "$p"; done | tr '\n' ' ')

            # Use -f -s to FORCE build outputs locally without rebuilding dependency trees
            if grep -qP "(^|\s)${pkg_names// /($|\s)|(^|\s)}($|\s)" ./big-pkgs.list; then
              ./scripts/setup-ubuntu.sh
              ./scripts/setup-cgct.sh
              sudo apt install -y ninja-build
              NDK=$ANDROID_NDK_LATEST_HOME ANDROID_HOME=$ANDROID_SDK_ROOT ./build-package.sh -I -f -s -a ${{ matrix.target_arch }} --format pacman --library glibc $packages
            else
              TERMUX_BUILDER_IMAGE_NAME="ghcr.io/termux/package-builder-cgct" ./scripts/run-docker.sh ./build-package.sh -I -f -s -a ${{ matrix.target_arch }} --format pacman --library glibc $packages
            fi
          fi

      - name: Create Pacman Index
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager

          for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
            mkdir -p dist/${repo}
            
            # Move all generated packages to the repo folder
            find output -type f -name "*.pkg.*" -exec mv -t dist/${repo}/ {} + 2>/dev/null || true
            
            cd dist/${repo}
            # Only run repo-add if packages actually exist
            if ls *.pkg.* 1> /dev/null 2>&1; then
              repo-add ${repo}.db.tar.gz *.pkg.*
            fi
            cd ../../
          done

      - name: Store repository artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpkg-repo-${{ matrix.target_arch }}-${{ github.sha }}
          path: dist/
